# Standalone release pipeline for the QwenPaw Creator plugin.
#
# Driven by the Creator plugin's own version: it fires when
# plugins/apps/qwenpaw-creator/plugin.json changes, and only publishes when
# that version is not yet on AgentScope Platform. Can also be run manually
# via the Actions tab (with an optional force flag).
#
# Packing + publishing itself lives in plugins-platform-publish.yml, which is
# called with `plugins: qwenpaw-creator` so there is exactly one
# implementation of the zip/publish contract.

name: QwenPaw Creator Plugin Release

on:
  push:
    branches: [main]
    paths:
      - "plugins/apps/qwenpaw-creator/plugin.json"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if this version already exists on platform"
        required: false
        type: boolean
        default: false

# Least-privilege token: this workflow only reads the repo; publishing goes
# through the asp CLI with platform account secrets.
permissions:
  contents: read

concurrency:
  group: creator-release
  cancel-in-progress: false

env:
  PLUGIN_DIR: plugins/apps/qwenpaw-creator
  PLUGIN_ID: qwenpaw-creator
  PLATFORM_URL: https://platform.agentscope.io

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.decide.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Creator plugin version
        id: version
        run: |
          version=$(jq -r '.version' "${PLUGIN_DIR}/plugin.json")
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "ERROR: no version in ${PLUGIN_DIR}/plugin.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Creator plugin version: $version"

      - name: Decide whether to publish
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          # Publish only when this exact version is missing from the platform
          # version list (or when forced). Keeps re-runs and non-version edits
          # to plugin.json idempotent.
          #
          # Fail closed: only HTTP 404 (plugin unknown to the platform) or a
          # version list without this version counts as "not published yet".
          # Network, auth or JSON failures abort instead of being misread as a
          # green light to republish.
          if [[ "$FORCE" == "true" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Force publish requested for ${PLUGIN_ID}@${VERSION}."
            exit 0
          fi
          url="${PLATFORM_URL}/api/cli/v1/plugins/${PLUGIN_ID}/versions"
          http_code=$(curl -sSL --retry 3 -o versions.json \
            -w '%{http_code}' "$url") || {
            echo "ERROR: could not reach ${url}." >&2
            exit 1
          }
          if [[ "$http_code" == "404" ]]; then
            published="false"
          elif [[ "$http_code" == "200" ]]; then
            published=$(jq -r --arg v "$VERSION" \
              '[(.items // [])[] | .version] | index($v) != null' \
              versions.json) || {
              echo "ERROR: platform version list is not valid JSON." >&2
              exit 1
            }
          else
            echo "ERROR: unexpected HTTP ${http_code} from ${url}." >&2
            exit 1
          fi
          if [[ "$published" == "true" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "${PLUGIN_ID}@${VERSION} already on platform; skipping."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "${PLUGIN_ID}@${VERSION} not on platform yet; publishing."
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    uses: ./.github/workflows/plugins-platform-publish.yml
    with:
      plugins: qwenpaw-creator
    secrets: inherit
